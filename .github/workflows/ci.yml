name: ci

# 加引号是为了让本地 YAML 1.1 的 linter 也认（PyYAML 会把裸 on 读成 True）
"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 测试 + 冒烟：起真的 PG/Redis，跑 150 个用例和 40 项 HTTP 冒烟 ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tdp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tdp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      TDP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/tdp
      TDP_REDIS_URL: redis://127.0.0.1:6380/0
      TDP_TZ: Asia/Shanghai
      TDP_CACHE_STRATEGY: delete
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 建库建表 + 补索引 + 演示数据（Alembic 迁移）
        run: python scripts/init_db.py --seed-demo

      - name: 迁移必须幂等（再跑一次不应有任何变更）
        run: |
          python scripts/init_db.py
          python -m alembic -c alembic.ini current
          python -m alembic -c alembic.ini history

      - name: 静态检查（只查真正的错误，不卡风格）
        run: ruff check app tests scripts bench --select F,E9,F63,F7,F82,B

      - name: 单元 + 集成测试（真库 + 真 Redis，覆盖率门禁 85%）
        run: |
          python -m pytest -q --junitxml=pytest-report.xml \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85

      - name: 端到端冒烟（真实 HTTP，40 项）
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          python scripts/api_smoke.py --base-url http://127.0.0.1:8000

      - name: 归档 junit 报告（失败时也能看到哪条挂了）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore


  # ── 3. 供应链与密钥扫描：依赖有已知漏洞、仓库里混进密钥都要拦下来 ──
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks 要扫全历史，浅克隆会漏

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依赖漏洞扫描（pip-audit）
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt --strict || \
            (echo "::warning::依赖存在已知漏洞，评估后升级或记录例外"; exit 1)

      - name: 密钥/凭据扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ── 2. 镜像能构建、compose 文件合法（本地没装 Docker，靠 CI 兜底）──
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 语法与变量展开
        run: docker compose config --quiet

      - name: 构建镜像
        run: docker build -t tdp:ci .

      - name: 镜像里的应用能导入（快速证明依赖齐全）
        run: docker run --rm tdp:ci python -c "import app.main; print('app import ok')"
