# Nginx 反代配置：把 80/443 转到只监听回环的 app:8000
#
# 放到 /etc/nginx/conf.d/tdp.conf，`nginx -t && systemctl reload nginx`。
#
# 两个关键点：
#   1. /metrics 只允许本机访问 —— 指标里有接口路径和状态码分布，属于内部信息；
#   2. 前端是 SPA（hash 路由），不需要 try_files 兜底；/ui 由后端 StaticFiles 提供。

upstream tdp_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;              # 有域名就换成域名；没有域名用 IP 也能跑

    # 申请证书时放开这段（certbot --webroot 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 指标只给本机看（Prometheus 也在本机时够用）
    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://tdp_app;
    }

    location / {
        proxy_pass http://tdp_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 大一点的请求体（导入/批量提交时用得上）
        client_max_body_size 8m;

        # 静态资源（JS/CSS）缓存一天；文件名带 hash，改了自然会变
        proxy_read_timeout 60s;
    }

    location /ui/assets/ {
        proxy_pass http://tdp_app;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}

