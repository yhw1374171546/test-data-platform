# Alembic configuration.
#
# NOTE: keep this file ASCII-only on purpose -- Python's configparser reads it
# with the *locale* encoding (GBK on zh-CN Windows), so UTF-8 Chinese comments
# here blow up with UnicodeDecodeError. Put explanations in env.py instead
# (Python source is always read as UTF-8).
#
# sqlalchemy.url is intentionally empty: migrations/env.py takes it from
# TDP_DATABASE_URL, so local / CI / container all share one source of truth.

[alembic]
script_location = migrations
sqlalchemy.url =
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
